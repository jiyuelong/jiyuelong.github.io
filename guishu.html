<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>司机归属查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.container{max-width:480px;width:100%}
h1{text-align:center;font-size:1.4rem;margin-bottom:24px;color:#58a6ff}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:16px}
.card h2{font-size:1rem;color:#8b949e;margin-bottom:16px;text-align:center}
input[type=text],input[type=password]{width:100%;padding:12px 16px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e1e4e8;font-size:1rem;outline:none}
input:focus{border-color:#58a6ff}
.btn{width:100%;padding:12px;margin-top:12px;background:#238636;border:none;border-radius:8px;color:#fff;font-size:1rem;cursor:pointer;-webkit-appearance:none}
.stats{text-align:center;color:#8b949e;font-size:.9rem;margin-top:12px}
.hide{display:none!important}
#result{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;margin-top:16px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.value{font-size:1.05rem;color:#f0f6fc;word-break:break-all}
#notfound{background:#161b22;border:1px solid #e74c3c;border-radius:12px;padding:20px;margin-top:16px;text-align:center;color:#e74c3c}
#loading{text-align:center;color:#8b949e;margin-top:12px;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
<h1>🔍 司机归属查询</h1>
<div id="auth-box" class="card">
<h2>请输入访问口令</h2>
<input type="password" id="auth-input" placeholder="输入口令..."/>
<div class="btn" id="auth-btn">确认</div>
</div>
<div id="search-box" class="card hide">
<input type="text" id="gh-input" placeholder="输入工号查询..."/>
<div class="btn" id="search-btn">查询</div>
<div class="stats">共收录 <span id="dc">-</span> 名司机，<span id="cc">-</span> 家公司</div>
<div id="loading"> 正在加载数据...</div>
</div>
<div id="result" class="hide">
<div class="field"><div class="label">姓名</div><div class="value" id="rn"></div></div>
<div class="field"><div class="label">工号</div><div class="value" id="rg"></div></div>
<div class="field"><div class="label">ID</div><div class="value" id="rid"></div></div>
<div class="field"><div class="label">所属公司</div><div class="value" id="rco"></div></div>
</div>
<div id="notfound" class="hide">未找到该工号，请检查输入是否正确</div>
</div>
<script>
(function(){
var AUTH_HASH='105725',STORAGE_KEY='ss_auth_v1',DATA=null;
var BASE='https://cdn.jsdelivr.net/gh/jiyuelong/jiyuelong.github.io@main/guishu/chunks/',TOTAL=24,ok=0,fail=0;
window.__CHUNKS__=[];
function simpleHash(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return String(Math.abs(h))}
function done(){ok+fail>=TOTAL&&(DATA=__CHUNKS__.reduce(function(a,c){for(var k in c)a[k]=c[k];return a},{}),showStats())}
function load(i){var s=document.createElement('script');s.src=BASE+'data_'+i+'.js?v=4';s.onload=function(){ok++;done()};s.onerror=function(){fail++;done()};document.head.appendChild(s)}
function showStats(){document.getElementById('loading').className='hide';if(!DATA)return;var keys=Object.keys(DATA);document.getElementById('dc').textContent=keys.length;var comps={};for(var i=0;i<keys.length;i++)comps[DATA[keys[i]].company]=1;document.getElementById('cc').textContent=Object.keys(comps).length}
function doAuth(){var v=document.getElementById('auth-input').value;if(simpleHash(v)===AUTH_HASH){localStorage.setItem(STORAGE_KEY,AUTH_HASH);document.getElementById('auth-box').className='hide';document.getElementById('search-box').className='card';for(var i=0;i<TOTAL;i++)load(i)}else{document.getElementById('auth-input').style.borderColor='#e74c3c';setTimeout(function(){document.getElementById('auth-input').style.borderColor='#30363d'},1500)}}
function doSearch(){var gh=document.getElementById('gh-input').value.trim();if(!gh)return;if(!DATA){setTimeout(doSearch,800);return}document.getElementById('result').className='hide';document.getElementById('notfound').className='hide';var d=DATA[gh];if(d){document.getElementById('rn').textContent=d.name;document.getElementById('rg').textContent=d.gh;document.getElementById('rid').textContent=d.id;document.getElementById('rco').textContent=d.company;document.getElementById('result').className=''}else{document.getElementById('notfound').className=''}}
document.getElementById('auth-btn').onclick=doAuth;document.getElementById('search-btn').onclick=doSearch;
document.getElementById('gh-input').onkeydown=function(e){if(e.key==='Enter')doSearch()};
document.getElementById('auth-input').onkeydown=function(e){if(e.key==='Enter')doAuth()};
if(localStorage.getItem(STORAGE_KEY)===AUTH_HASH){document.getElementById('auth-box').className='hide';document.getElementById('search-box').className='card';for(var i=0;i<TOTAL;i++)load(i)}
})();
</script>
</body>
</html>
