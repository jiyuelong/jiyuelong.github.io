<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>盛世代驾数据看板</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:#1a1f35; color:#e6e9f5; font-size:14px; line-height:1.5; min-height:100vh; }
.wrap { max-width:720px; margin:0 auto; padding:14px; }
.hdr { text-align:center; padding:36px 16px 10px; }
.hdr h1 { margin:0 0 8px 0; font-size:28px; font-weight:800; letter-spacing:1px; color:#fff; }
.hdr .sub { font-size:14px; color:#8892b0; }
.featured { display:block; background:linear-gradient(135deg,#4a3f8a,#6b5ce7); border-radius:20px; padding:28px 24px; margin:24px 14px 0; text-decoration:none; color:#fff; transition:.25s; position:relative; overflow:hidden; }
.featured:hover,.featured:active { transform:translateY(-2px); box-shadow:0 8px 30px rgba(107,92,231,.4); }
.featured .badge { position:absolute; top:16px; right:16px; background:#f97316; color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
.featured .row { display:flex; align-items:center; gap:16px; }
.featured .ficon { font-size:42px; flex-shrink:0; }
.featured .ftitle { font-size:22px; font-weight:700; margin-bottom:4px; }
.featured .fdesc { font-size:13px; opacity:.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>盛世代驾数据看板</h1>
    <div class="sub">北京盛世兄弟汽车租赁有限公司</div>
  </div>
  <a class="featured" href="./driver360/">
    <span class="badge">推荐</span>
    <div class="row">
      <div class="ficon">🎯</div>
      <div>
        <div class="ftitle">司机 360 全景看板</div>
        <div class="fdesc">按司机聚合工单/违章/事故/画像，支持模糊搜索 · 一站看清每位司机风险</div>
      </div>
    </div>
  </a>
</div>
</body>
</html>
