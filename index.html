<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盛世代驾数据看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1a1f36 0%, #2d3561 100%);
  min-height: 100vh;
  color: #fff;
  padding: 20px;
}
.wrap { max-width: 720px; margin: 0 auto; padding-top: 8vh; }
h1 { font-size: 28px; text-align: center; margin-bottom: 6px; font-weight: 600; letter-spacing: 2px; }
.sub { text-align: center; color: #a8b0d1; font-size: 13px; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  text-decoration: none;
  color: #fff;
  transition: all 0.25s;
  display: block;
}
.card:hover, .card:active {
  transform: translateY(-3px);
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.25);
}
.icon { font-size: 40px; margin-bottom: 10px; }
.name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.desc { font-size: 12px; color: #a8b0d1; }
.foot { text-align: center; margin-top: 40px; color: #6a7196; font-size: 11px; }
@media (max-width: 480px) {
  h1 { font-size: 22px; }
  .grid { grid-template-columns: 1fr; }
  .card { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>盛世代驾数据看板</h1>
  <div class="sub">北京盛世兄弟汽车租赁有限公司</div>
  <div class="grid">
    <a class="card" href="./cejiu/">
      <div class="icon">🍺</div>
      <div class="name">测酒看板</div>
      <div class="desc">上线人次 · 合格率 · 优推</div>
    </a>
    <a class="card" href="./chengben/">
      <div class="icon">💰</div>
      <div class="name">成本看板</div>
      <div class="desc">事故成本 · 大队维度</div>
    </a>
    <a class="card" href="./gongdan/">
      <div class="icon">📋</div>
      <div class="name">工单看板</div>
      <div class="desc">风险排查 · 流程跟进</div>
    </a>
    <a class="card" href="./weizhang/">
      <div class="icon">🚗</div>
      <div class="name">违章看板</div>
      <div class="desc">违章明细 · 大队汇总</div>
    </a>
  </div>
  <div class="foot">© 盛世兄弟安全部</div>
</div>
</body>
</html>
