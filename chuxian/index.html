  grid:{left:'12%',right:'6%',top:'8%',bottom:'12%'},
  tooltip:{trigger:'axis',backgroundColor:'#141b2d',borderColor:'#2a3352',textStyle:{color:'#e6e9f5'}},
  xAxis:{type:'category',data:dimData.map(x=>x.name),...AX_NO_SPLIT,axisLabel:{...AX.axisLabel,interval:0,fontSize:11}},
  yAxis:{type:'value',...AX},
  series:[{type:'bar',data:dimData.map(x=>x.value),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#ff5b6a'},{offset:1,color:'#8b3a55'}]),borderRadius:[6,6,0,0]},label:{show:true,position:'top',color:'#e6e9f5',fontSize:11}}]
});

// 多维叠加饼图
const md = st.multi_dim || {};
echarts.init(document.getElementById('chart_multi')).setOption({
  backgroundColor:'transparent',
  tooltip:{trigger:'item',backgroundColor:'#141b2d',borderColor:'#2a3352',textStyle:{color:'#e6e9f5'}},
  legend:{bottom:0,textStyle:{color:'#9aa3bd',fontSize:11}},
  series:[{type:'pie',radius:['45%','70%'],center:['50%','45%'],
    data:Object.entries(md).map(([k,v])=>({
      value:v, name:`命中${k}个维度`,
      itemStyle:{color: k==='4'?'#ff2c3a': k==='3'?'#ff8a3d': k==='2'?'#f5b73a':'#5b8def'}
    })),
    label:{color:'#e6e9f5',fontSize:11,formatter:'{b}\n{c}人'},
    labelLine:{lineStyle:{color:'#5b6070'}}
  }]
});

// 组队分布柱状图 TOP12
const teamEntries = Object.entries(st.team_dist||{}).slice(0,12);
echarts.init(document.getElementById('chart_team')).setOption({
  backgroundColor:'transparent',
  grid:{left:'20%',right:'8%',top:'4%',bottom:'6%'},
  tooltip:{trigger:'axis',backgroundColor:'#141b2d',borderColor:'#2a3352',textStyle:{color:'#e6e9f5'}},
  xAxis:{type:'value',...AX},
  yAxis:{type:'category',data:teamEntries.map(x=>x[0]).reverse(),...AX_NO_SPLIT,axisLabel:{...AX.axisLabel,fontSize:12}},
  series:[{type:'bar',data:teamEntries.map(x=>x[1]).reverse(),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#8b3a55'},{offset:1,color:'#ff5b6a'}]),borderRadius:[0,6,6,0]},label:{show:true,position:'right',color:'#e6e9f5',fontSize:11}}]
});

// ---- 清单交互 ----
const RECORDS = DATA.records;
const tierChips = document.getElementById('tier_chips');
const TIERS = ['全部','极高危','高危','中危','观察'];
TIERS.forEach(t=>{
  const c=document.createElement('div');
  c.className='chip'+(t==='全部'?' active':'');
  c.textContent=t==='全部'?`全部 ${RECORDS.length}`:`${t} ${st.tier_dist[t]||0}`;
  c.dataset.v=t;
  c.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    curTier=t; // ---- 加星司机 ----
const STAR_LIST = DATA.star_list || [];
if (STAR_LIST.length > 0) {
  const wrap = document.getElementById('star_section_wrap');
  wrap.innerHTML = `<div class="star-section">
    <h3>⭐ 加星关注司机 (${STAR_LIST.length}人)</h3>
    ${STAR_LIST.map(s => `<div class="star-item">
      <div>
        <div class="star-name">${s.name_mask || s.name}<span class="gh">${s.gh}</span></div>
        <div class="star-meta">${s.team || '-'} · ${s.date || ''}</div>
      </div>
      <div class="star-reason">${s.reason || ''}</div>
    </div>`).join('')}
  </div>`;
}

renderList();
  };
  tierChips.appendChild(c);
});
// 组队下拉
const teamSel = document.getElementById('f_team');
Object.keys(st.team_dist||{}).forEach(t=>{
  const o=document.createElement('option');o.value=t;o.textContent=`${t} (${st.team_dist[t]})`;teamSel.appendChild(o);
});

let curTier='全部', curTeam='', curDim='', curKw='', pageSize=30, curShow=30;
document.getElementById('f_team').onchange = e=>{curTeam=e.target.value; curShow=pageSize; renderList();};
document.getElementById('f_dim').onchange  = e=>{curDim=e.target.value; curShow=pageSize; renderList();};
document.getElementById('f_kw').oninput    = e=>{curKw=e.target.value.trim().toLowerCase(); curShow=pageSize; renderList();};
document.getElementById('load_more').onclick = ()=>{curShow+=pageSize; renderList();};

function filtered(){
  return RECORDS.filter(r=>{
    if(curTier!=='全部' && r.tier!==curTier) return false;
    if(curTeam && r.team!==curTeam) return false;
    if(curDim){
      if(curDim==='A' && r.A_accident_score<=0) return false;
      if(curDim==='B' && r.B_gaowei_score<=0) return false;
      if(curDim==='C' && r.C_weizhang_score<=0) return false;
      if(curDim==='D' && r.D_jianzhi_score<=0) return false;
      if(curDim==='E' && r.E_jiuce_score<=0) return false;
    }
    if(curKw){
      const key = (r.name+r.name_mask+r.gh).toLowerCase();
      if(!key.includes(curKw)) return false;
    }
    return true;
  });
}

function renderList(){
  const fs = filtered();
  document.getElementById('list_count').textContent = `共 ${fs.length} 人${fs.length>curShow?` · 显示前 ${curShow}`:''}`;
  const show = fs.slice(0, curShow);
  document.getElementById('list_box').innerHTML = show.map(itemHTML).join('');
  document.getElementById('load_more').style.display = fs.length>curShow?'block':'none';
  bindItemToggle();
}

function itemHTML(r){
  const A_hit = r.A_accident_score>0;
  const B_hit = r.B_gaowei_score>0;
  const C_hit = r.C_weizhang_score>0;
  const D_hit = r.D_jianzhi_score>0;
  const E_hit = r.E_jiuce_score>0;
  return `
  <div class="item tier-${r.tier}" data-gh="${r.gh}">
    <div class="itm-head">
      <div class="itm-l">
        <div class="itm-name">${r.name_mask}<span class="gh">${r.gh}</span></div>
        <div class="itm-meta">${r.team} · 代驾分 ${r.daijia}${r.status?` · ${r.status}`:''}</div>
      </div>
      <div class="itm-r">
        <div class="itm-score" style="color:${r.tier==='极高危'?'#ff5b6a':r.tier==='高危'?'#ffa66a':r.tier==='中危'?'#f5c76a':'#a8c1f8'}">${r.total_score}</div>
        <div class="itm-tier-tag tag-${r.tier}">${r.tier}</div>
      </div>
    </div>
    <div class="dim-row">
      <div class="dim-cell ${A_hit?'hit':''}"><div class="dcv">${r.A_accident_score}</div><div class="dcl">A事故 ${r.A_accident_n?`(${r.A_accident_n}起)`:''}</div></div>
      <div class="dim-cell ${B_hit?'hit':''}"><div class="dcv">${r.B_gaowei_score}</div><div class="dcl">B高危 ${r.B_gaowei_hit?`(命中${r.B_gaowei_hit})`:''}</div></div>
      <div class="dim-cell ${C_hit?'hit':''}"><div class="dcv">${r.C_weizhang_score}</div><div class="dcl">C违章 ${r.C_weizhang_danger?`(危险${r.C_weizhang_danger})`:''}</div></div>
      <div class="dim-cell ${D_hit?'hit':''}"><div class="dcv">${r.D_jianzhi_score}</div><div class="dcl">D兼职</div></div>
      <div class="dim-cell ${E_hit?'hit':''}"><div class="dcv">${r.E_jiuce_score}</div><div class="dcl">E酒测 ${(r.E_jiuce_info&&r.E_jiuce_info.risk)?`(${r.E_jiuce_info.risk.replace('风险','')})`:''}</div></div>
    </div>
    <div class="detail">
      ${A_hit?renderA(r):''}
      ${B_hit?renderB(r):''}
      ${C_hit?renderC(r):''}
      ${D_hit?renderD(r):''}
      ${E_hit?renderE(r):''}
    </div>
  </div>`;
}

function renderA(r){
  const list = (r.A_accident_list||[]).slice(0,10);
  return `<div class="detail-sec">
    <div class="detail-h">🚗 历史事故 <span class="cnt">${r.A_accident_n}起</span>${r.A_accident_recent180?` · 近180天 <span class="cnt">${r.A_accident_recent180}起</span>`:''} · 最后一次 ${r.A_accident_last||'-'}</div>
    <div class="mini-list">${list.map(x=>`<div class="mini-item"><span class="d">${x.date}</span> · <span class="t">${x.resp||''} ${x.level||''} ${x.type||''}</span>${x.involve?` · ${x.involve}`:''}${x.settle?` · <span class="d">${x.settle}</span>`:''}</div>`).join('')}${r.A_accident_n>10?`<div class="mini-item d">... 还有${r.A_accident_n-10}起</div>`:''}</div>
  </div>`;
}

function renderB(r){
  const flags = r.B_gaowei_flags||[];
  return `<div class="detail-sec">
    <div class="detail-h">⚠️ 高危驾驶标签 <span class="cnt">${flags.length}项</span></div>
    <div>${flags.map(f=>`<span class="tag danger">${f}</span>`).join('')}${r.B_gaowei_hit?`<span class="tag warn">总命中${r.B_gaowei_hit}项</span>`:''}</div>
  </div>`;
}

function renderC(r){
  const list = (r.C_weizhang_detail||[]).slice(0,10);
  return `<div class="detail-sec">
    <div class="detail-h">🚦 违章明细 <span class="cnt">共${list.length}条计分</span>${r.C_weizhang_danger?` · 危险类型 <span class="cnt">${r.C_weizhang_danger}条</span>`:''}</div>
    <div class="mini-list">${list.map(x=>`<div class="mini-item"><span class="d">${x.date}</span> · <span class="t">${x.type}</span>${x.score?` <span class="tag warn">记${x.score}分</span>`:''}${x.status?` <span class="d">· ${x.status}</span>`:''}${x.place?`<br><span class="d">地点：${x.place}</span>`:''}</div>`).join('')}</div>
  </div>`;
}

function renderD(r){
  const i = r.D_jianzhi_info||{};
  return `<div class="detail-sec">
    <div class="detail-h">👥 低频兼职画像</div>
    <div class="jz-grid">
      <div class="jz-cell"><div class="k">6/1-7/14 上线</div><div class="v">${i.total_online_days}天</div></div>
      <div class="jz-cell"><div class="k">折算月均</div><div class="v">${i.avg_days_m}天</div></div>
      <div class="jz-cell"><div class="k">7月流水</div><div class="v">¥${i.jul_amount}</div></div>
      <div class="jz-cell"><div class="k">月均流水</div><div class="v">¥${i.avg_amt_m}</div></div>
    </div>
    <div style="margin-top:6px;font-size:11px;color:#606a85">身份：${i.role||'-'} · 7月已上线 ${i.jul_days}天 / ${i.jul_orders}单</div>
  </div>`;
}

function renderE(r){
  const i = r.E_jiuce_info||{};
  const riskColor = i.risk==='高风险'?'#ff5b6a':i.risk==='较高风险'?'#ffa66a':'#f5c76a';
  return `<div class="detail-sec">
    <div class="detail-h">🍺 酒测缺失详情 <span class="cnt" style="color:${riskColor}">${i.risk||'-'}</span></div>
    <div class="jz-grid">
      <div class="jz-cell"><div class="k">距上次测酒</div><div class="v">${i.days_no_test||0}天</div></div>
      <div class="jz-cell"><div class="k">近30天在线</div><div class="v">${i.online_days||0}天</div></div>
      <div class="jz-cell"><div class="k">AI 模型命中</div><div class="v">${i.ai_hit||0}次</div></div>
      <div class="jz-cell"><div class="k">合规状态</div><div class="v" style="color:${riskColor}">${i.active?'活跃未测':'非活跃'}</div></div>
    </div>
    <div style="margin-top:6px;font-size:11px;color:#606a85">数据源：滴滴平台"近30天线下未酒测名单"（每周推送）· 建议：立即安排线下测酒 + 与司服交办</div>
  </div>`;
}

function bindItemToggle(){
  document.querySelectorAll('.item').forEach(it=>{
    it.onclick = ()=>{
      it.querySelector('.detail').classList.toggle('open');
    };
  });
}

renderList();
</script>
</body>
</html>
